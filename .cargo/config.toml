# ── RIVAREN: configuración unificada multi-target ──
# Un solo `cargo xtask build-all` compila para Linux/Mac/Windows con flags óptimos.
#
# IMPORTANTE: no poner `rustflags` en `[build]`: se aplicarían a TODOS los
# targets (incluido aarch64-apple-darwin), lo que corrompe el codegen en ARM.
# Los flags óptimos van por-target; el default queda en manos de rustc.
[build]
# Jobs paralelos = todos los hilos (por defecto = nº CPUs). No fijar a 0 (inválido).

[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "link-arg=-Wl,--as-needed"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "target-cpu=x86-64-v2"]

# macOS: x86_64 usa v2; Apple Silicon queda con el default (M1+) del compilador.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-apple-darwin]

# Android (Xiaomi 14C): requiere NDK. Se configura vía env ANDROID_NDK_HOME.
[target.aarch64-linux-android]
linker = "aarch64-linux-android33-clang"
rustflags = ["-C", "target-cpu=generic", "-C", "opt-level=s"]

[term]
verbose = false
color = "auto"
